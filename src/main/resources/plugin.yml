name: LegendaryTierlist
version: 1.0.0
main: com.legendary.tierlist.TierPlugin
api-version: 1.21
description: Tierlist management system with Discord webhook synchronization.
commands:
  t4f:
    description: Admin tier management command.
    permission: tierlist.admin
    usage: /t4f add <player> <tier>
  tierlist:
    description: Opens the in-game tier list menu.
    usage: /tierlist
